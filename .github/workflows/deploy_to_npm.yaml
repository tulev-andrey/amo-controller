name: Publish NPM Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Prepare package
        run: |
          cp package.json amo/package.json

          if [ -f README.md ]; then
            cp README.md amo/README.md
          fi

          if [ -f LICENSE ]; then
            cp LICENSE amo/LICENSE
          fi

      - name: Inspect package contents
        working-directory: ./amo
        run: |
          cat package.json
          find . -maxdepth 3 -type f
          npm pack --dry-run

      - name: Release
        run: npx --yes semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
